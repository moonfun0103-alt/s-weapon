<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 전신 스타일링 스튜디오</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #000; color: #fff; margin: 0; overflow-x: hidden; }
        .screen { display: none; min-height: 100vh; width: 100%; max-width: 480px; margin: 0 auto; background-color: #111827; position: relative; }
        .screen.active { display: flex; flex-direction: column; }
        
        /* 스캐닝 애니메이션 */
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .scanner-line {
            position: absolute;
            left: 0; right: 0; height: 3px;
            background: #10b981;
            box-shadow: 0 0 15px #10b981;
            animation: scan 2s linear infinite;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- ==================== 페이지 1: SMS QR 코드 ==================== -->
    <div id="page-qr" class="screen active p-6 items-center justify-center text-center">
        <h1 class="text-2xl font-bold mb-2">스타일링 시작하기</h1>
        <p class="text-gray-400 text-sm mb-8">아래 QR을 스캔하여 SMS 인증을 진행하거나<br>다음 버튼을 눌러 카메라를 켜주세요.</p>
        
        <!-- QR 코드 API 활용 (sms: URL 스킴 사용) -->
        <div class="bg-white p-4 rounded-2xl mb-10 shadow-[0_0_30px_rgba(255,255,255,0.1)]">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=sms:010-0000-0000?body=AI스타일링신청" alt="SMS QR Code" class="w-48 h-48">
        </div>

        <button onclick="goToPage('page-camera')" class="w-full max-w-xs py-4 bg-gradient-to-r from-emerald-500 to-teal-500 text-white rounded-xl font-bold text-lg hover:scale-105 transition-transform shadow-lg shadow-emerald-500/30">
            전신 촬영 시작하기 📸
        </button>
    </div>

    <!-- ==================== 페이지 2: 전신 샷 카메라 ==================== -->
    <div id="page-camera" class="screen bg-black">
        <header class="absolute top-0 left-0 right-0 p-4 z-10 bg-gradient-to-b from-black/80 to-transparent flex justify-between items-center">
            <button onclick="goToPage('page-qr')" class="text-white">← 뒤로</button>
            <span class="font-bold">전신 프레임 맞추기</span>
            <div class="w-8"></div> <!-- 여백용 -->
        </header>

        <!-- 카메라 화면 -->
        <div class="relative flex-1 overflow-hidden">
            <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
            <!-- 전신 가이드라인 -->
            <div class="absolute inset-10 border-2 border-dashed border-white/40 rounded-3xl pointer-events-none flex items-center justify-center">
                <span class="bg-black/50 text-white/70 text-xs px-3 py-1 rounded-full">전신이 나오게 서주세요</span>
            </div>
        </div>

        <!-- 하단 촬영 컨트롤 -->
        <div class="h-32 bg-black flex items-center justify-center pb-4">
            <button onclick="capturePhoto()" class="w-20 h-20 bg-transparent border-4 border-white rounded-full flex items-center justify-center p-1 active:scale-95 transition-transform">
                <div class="w-full h-full bg-white rounded-full"></div>
            </button>
        </div>
    </div>

    <!-- ==================== 페이지 3: AI 분석 및 결과 ==================== -->
    <div id="page-result" class="screen overflow-y-auto pb-10">
        <header class="p-4 bg-gray-900 sticky top-0 z-20 flex items-center border-b border-gray-800">
            <button onclick="goToPage('page-camera')" class="text-gray-400 mr-4">← 다시 찍기</button>
            <span class="font-bold flex-1 text-center">AI 분석 결과</span>
            <div class="w-16"></div>
        </header>

        <!-- 촬영된 이미지 영역 -->
        <div class="relative w-full h-[60vh] bg-black">
            <canvas id="canvas" class="hidden"></canvas>
            <img id="captured-img" class="w-full h-full object-cover" />
            
            <!-- AI 로딩 스캐너 -->
            <div id="ai-scanner" class="absolute inset-0 bg-emerald-900/30 backdrop-blur-[2px] z-10 flex flex-col items-center justify-center">
                <div class="scanner-line"></div>
                <div class="bg-black/80 px-6 py-3 rounded-2xl border border-emerald-500/30 text-center">
                    <div class="w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                    <p id="loading-text" class="text-emerald-400 font-medium text-sm">체형 및 비율 스캔 중...</p>
                </div>
            </div>
            
            <!-- 피팅 완료 이펙트 (분석 후 나타남) -->
            <div id="fit-effect" class="hidden absolute inset-0 border-4 border-emerald-400 transition-all z-10 shadow-[inset_0_0_50px_rgba(16,185,129,0.5)]"></div>
        </div>

        <!-- 분석 결과 데이터 영역 -->
        <div id="result-card" class="hidden relative z-20 bg-gray-900 -mt-6 rounded-t-3xl p-6 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
            <div class="flex justify-between items-end mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-white mb-1">분석 리포트</h2>
                    <p class="text-emerald-400 text-sm font-medium">✨ 맞춤형 가상 피팅 완료</p>
                </div>
                <span id="res-age" class="text-gray-400 text-sm border border-gray-700 px-3 py-1 rounded-full"></span>
            </div>

            <!-- 성향 및 무드 -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                    <p class="text-xs text-gray-400 mb-1">예측 MBTI 무드</p>
                    <p id="res-mbti" class="text-lg font-bold text-white"></p>
                </div>
                <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                    <p class="text-xs text-gray-400 mb-1">퍼스널 무드</p>
                    <p id="res-vibe" class="text-lg font-bold text-white"></p>
                </div>
            </div>

            <!-- 피팅 추천 제안 -->
            <div class="bg-gradient-to-br from-gray-800 to-gray-900 rounded-xl p-5 border border-gray-700 mb-6">
                <h3 class="font-bold mb-2 flex items-center"><span class="text-xl mr-2">👕</span> AI 피팅 추천 룩</h3>
                <p id="res-outfit" class="text-sm text-gray-300 leading-relaxed"></p>
            </div>

            <button onclick="goToPage('page-qr')" class="w-full py-4 bg-gray-800 text-white rounded-xl font-bold text-sm hover:bg-gray-700 transition-colors border border-gray-700">
                처음으로 돌아가기
            </button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const capturedImg = document.getElementById('captured-img');
        let currentStream = null;

        // 페이지 전환 로직
        function goToPage(pageId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');

            if (pageId === 'page-camera') {
                startCamera();
            } else if (currentStream) {
                // 카메라 화면이 아닐 때는 배터리 절약을 위해 카메라 끄기
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
        }

        // 후면(전신) 카메라 실행
        async function startCamera() {
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, // 전신 샷을 위해 후면 카메라 우선
                    audio: false 
                });
                video.srcObject = currentStream;
            } catch (err) {
                alert("카메라 권한을 허용해주세요.");
            }
        }

        // 사진 캡처 및 페이지 3으로 이동
        function capturePhoto() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            // 캡처한 이미지를 이미지 태그에 적용
            capturedImg.src = canvas.toDataURL('image/jpeg');
            
            goToPage('page-result');
            runAIAnalysis();
        }

        // AI 분석 시뮬레이션
        function runAIAnalysis() {
            // 초기화
            document.getElementById('ai-scanner').classList.remove('hidden');
            document.getElementById('result-card').classList.add('hidden');
            document.getElementById('fit-effect').classList.add('hidden');
            
            const loadingText = document.getElementById('loading-text');
            const steps = [
                "체형 및 비율 스캔 중...",
                "나이 및 얼굴 분위기 인식 중...",
                "MBTI 성향 기반 스타일 매칭 중...",
                "어울리는 의상 렌더링 중..."
            ];

            let step = 0;
            const interval = setInterval(() => {
                step++;
                if (step < steps.length) {
                    loadingText.innerText = steps[step];
                }
            }, 800);

            // 3.5초 후 분석 완료
            setTimeout(() => {
                clearInterval(interval);
                document.getElementById('ai-scanner').classList.add('hidden');
                document.getElementById('fit-effect').classList.remove('hidden');
                document.getElementById('result-card').classList.remove('hidden');
                
                generateResults();
            }, 3500);
        }

        // 결과 랜덤 생성 (MBTI, 분위기, 옷)
        function generateResults() {
            const ages = ["20대 초반", "20대 중반", "20대 후반", "30대 초반"];
            const mbtiData = [
                { mbti: "ESTP", vibe: "스포티 & 트렌디", desc: "자유분방하고 활동적인 매력이 돋보입니다. 움직임이 편하면서도 힙한 스트릿 웨어 위에 가벼운 오버핏 바람막이를 레이어드하여 가상 피팅을 적용했습니다." },
                { mbti: "INTJ", vibe: "시크 & 모던", desc: "도회적이고 지적인 분위기가 느껴집니다. 군더더기 없는 블랙 터틀넥과 테일러드 코트를 매치하여 깔끔하고 미니멀한 핏을 입혀보았습니다." },
                { mbti: "ENFP", vibe: "캐주얼 & 팝", desc: "밝고 긍정적인 에너지가 넘칩니다. 포인트 컬러가 들어간 맨투맨과 와이드 데님 팬츠를 조합해 생기 넘치는 데일리룩을 피팅했습니다." }
            ];

            const randomAge = ages[Math.floor(Math.random() * ages.length)];
            // ESTP에 관심이 있으셨던 기록을 반영하여 ESTP가 나올 확률을 조금 높이거나 다양하게 출력
            const randomType = mbtiData[Math.floor(Math.random() * mbtiData.length)];

            document.getElementById('res-age').innerText = `예측 연령: ${randomAge}`;
            document.getElementById('res-mbti').innerText = randomType.mbti;
            document.getElementById('res-vibe').innerText = randomType.vibe;
            document.getElementById('res-outfit').innerText = randomType.desc;
        }
    </script>
</body>
</html>
